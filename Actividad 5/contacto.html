<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Marina Ferreyra</title>
</head>
<body>

    <h1>Formulario de Contacto</h1>

    <p>
        ¿Necesitás una traducción o un presupuesto? Completá el siguiente formulario con
        el mayor detalle posible y te voy a responder a la brevedad con la información
        que necesitás.
    </p>

    <form action="#" method="post">

        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>

        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="telefono">Teléfono (opcional):</label><br>
            <input type="tel" id="telefono" name="telefono">
        </p>

        <p>
            <label for="servicio">Tipo de servicio:</label><br>
            <select id="servicio" name="servicio">
                <option value="traduccion_publica">Traducción pública</option>
                <option value="traduccion_tecnica">Traducción técnica</option>
                <option value="interpretacion">Interpretación consecutiva</option>
                <option value="otro">Otro</option>
            </select>
        </p>

        <p>
            <label for="idioma">Idioma (origen y destino):</label><br>
            <select id="idioma" name="idioma">
                <option value="ingles_espanol">Inglés - Español</option>
                <option value="espanol_ingles">Español - Inglés</option>
                <option value="portugues_espanol">Portugués - Español</option>
                <option value="espanol_portugues">Español - Portugués</option>
            </select>
        </p>

        <p>
            ¿Es urgente?<br>
            <input type="radio" id="urgente_si" name="urgencia" value="si">
            <label for="urgente_si">Sí</label><br>
            <input type="radio" id="urgente_no" name="urgencia" value="no">
            <label for="urgente_no">No</label>
        </p>

        <p>
            <label for="consulta">Detalle de la consulta:</label><br>
            <textarea id="consulta" name="consulta" rows="5" cols="40" required></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar consulta">
        </p>

    </form>

    <p>
        <a href="index.html">Volver a la página de inicio</a>
    </p>

</body>
</html>
